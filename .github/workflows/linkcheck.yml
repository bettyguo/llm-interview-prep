name: linkcheck

on:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r tools/requirements.txt
      - name: linkcheck
        run: python tools/linkcheck.py --permissive --timeout 15
      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkcheck-report
          path: tools/linkcheck-report.md
