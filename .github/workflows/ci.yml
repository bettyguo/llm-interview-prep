name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate entries + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r tools/requirements.txt
      - name: validate entries
        run: python tools/validate_entries.py --stats
      - name: build (check mode)
        run: python tools/build.py --check
